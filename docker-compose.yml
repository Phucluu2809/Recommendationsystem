version: "3.9"

services:
  app:
    build: .
    container_name: sgr_app
    platform: linux/amd64
    ports:
      - "5000:5000"
    depends_on:
      - neo4j
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always

  neo4j:
    image: neo4j:5
    container_name: sgr_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/12345678
    volumes:
      - neo4j_data:/data
    restart: always

volumes:
  neo4j_data:
